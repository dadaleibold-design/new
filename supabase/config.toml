# ============================================================
# إعدادات Edge Functions
# ------------------------------------------------------------
# send-push تستقبل POST من pg_net بلا JWT مستخدم. يجب أن يبقى
# verify_jwt=false وإلا ترفض بوابة Supabase الطلب قبل الدالة برمز
# UNAUTHORIZED_NO_AUTH_HEADER. الأمان داخل الدالة إلزامي عبر
# x-send-push-secret = SEND_PUSH_SECRET (32+ حرفاً)، ولا توجد قيمة افتراضية.
#
# انشر بعد تعديل الإعداد/الكود:
#   supabase functions deploy send-push --no-verify-jwt
# ============================================================
[functions.send-push]
verify_jwt = false

[functions.agora-token]
verify_jwt = false
