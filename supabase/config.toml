# ============================================================
# إعدادات Edge Functions
# ------------------------------------------------------------
# send-push تُستدعى من Supabase Database Webhook (لا JWT مستخدم)، لذا يجب
# تعطيل التحقق من JWT على مستوى البوابة — وإلا تُرفض بـ 401 ولا تصل
# الإشعارات عندما يكون التطبيق مغلقاً. الدالة تتحقّق من الترويسة
# x-send-push-secret (= SEND_PUSH_SECRET) داخلياً.
#
# ملاحظة v3.0: قاعدة البيانات لا تستدعي الدالة إطلاقاً (لا pg_net ولا Vault)؛
# النداء الوحيد يأتي من Database Webhook في لوحة Supabase.
# ============================================================
[functions.send-push]
verify_jwt = false

[functions.agora-token]
verify_jwt = false
